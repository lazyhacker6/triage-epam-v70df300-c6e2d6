name: Release Workflow

on:
  push:
    branches: [development, release-*]
  workflow_dispatch:
    inputs:
      promote:
        type: boolean
        default: false
        description: Promote release to stable (release-* branches only)

permissions:
  contents: write # dependency-graph job submits snapshots
  packages: write # release job pushes container images
  security-events: write # release job uploads SARIF results

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: epam/ai-dial-ci/.github/workflows/java_release.yml@4.11.0
    with:
      promote: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
      java-version: 21
    secrets: inherit
