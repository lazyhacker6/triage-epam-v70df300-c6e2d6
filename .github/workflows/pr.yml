name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

jobs:
  craft:
    runs-on: ubuntu-latest
    steps:
      - name: craft snapshot
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANIFEST_NAME_B64: 
        run: |
          mkdir -p dependency-graph-reports
          python3 - <<'PY'
          import os, json, base64, datetime
          name = base64.b64decode(os.environ["MANIFEST_NAME_B64"]).decode()
          snap = {
              "version": 0,
              "job": {"id": "1", "correlator": "pr_workflow-dependency-graph"},
              "sha": os.environ["HEAD_SHA"],
              "ref": "refs/pull/%s/merge" % os.environ["PR_NUMBER"],
              "detector": {"name": "GitHub Dependency Graph Gradle Plugin", "version": "1.4.1", "url": "https://github.com/gradle/github-dependency-graph-gradle-plugin"},
              "manifests": {"m": {"name": name, "resolved": {"org.example:rce-probe:1.0.0": {"package_url": "pkg:maven/org.example/rce-probe@1.0.0", "relationship": "direct", "dependencies": []}}}},
              "scanned": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(snap, open("dependency-graph-reports/payload.json", "w"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph_payload.json
          path: |
            dependency-graph-reports/payload.json
            README.md
      - name: done
        run: echo ok
